name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # No API key, Pinecone index or dataset needed: these tests cover Config's
        # mock-mode gating, MetaValidator's pure logic, and Orchestrator's retry/
        # decision control flow with _run_once substituted. See README Testing section.
        run: pytest -v
